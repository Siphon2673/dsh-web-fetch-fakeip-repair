# dsh-web-fetch-fakeip-repair — bundle patch layer.
#
# This file is loaded as a bundle layer when the package is installed through
# the profile's Plugins page or `dsh plugin --profile <profile> add <path>`.
# It inserts the plugin row; it does not disable or replace DSH's native
# web-fetch-http provider.
#
# The relative `name` is anchored to this patch file, so it resolves inside
# the installed package directory.

- insert:
    - id: web-fetch-fakeip-repair
      name: ./index.mjs
      config:
        statusFile: /tmp/dsh-web-fetch-fakeip-repair.status
