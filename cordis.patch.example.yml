# Example *manual* profile patch for dsh-web-fetch-fakeip-repair.
#
# The package also ships a bundle patch (`cordis.patch.yml`) used by the
# standard install flow (`dsh plugin add <path>` or the Web Plugins page).
# The manual row below is for a minimal install without a bundle dependency.
#
# Merge this block into $DSH_HOME/profiles/<profile>/cordis.patch.yml,
# which is the user patch layer applied after every bundle.
#
# Replace the `name` value with an absolute path to index.mjs in this
# repository. Alternatively, copy that file into
# $DSH_HOME/profiles/<profile>/plugins/ and use:
#
#     name: ./plugins/dsh-web-fetch-fakeip-repair.mjs
#
# `statusFile` is optional; it lets you check whether the plugin is active.

- insert:
    - id: web-fetch-fakeip-repair
      name: /home/elder/projects/dsh-web-fetch-fakeip-repair/index.mjs
      config:
        statusFile: /tmp/dsh-web-fetch-fakeip-repair.status
